name: one-shot adaptive prefetch fix

on:
  push:
    branches:
      - experiment/adaptive-prefetch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/adaptive-prefetch
          fetch-depth: 0
      - name: Apply root move filter fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/search/classic/search.cc')
          s = p.read_text()
          old = '''  int candidate_count = 0;
          for (const auto& edge : root->Edges()) {
            if (edge.GetP() <= 0.0f) continue;
          '''
          new = '''  int candidate_count = 0;
          const auto& root_move_filter = search_->root_move_filter_;
          for (const auto& edge : root->Edges()) {
            if (!root_move_filter.empty() &&
                std::find(root_move_filter.begin(), root_move_filter.end(),
                          edge.GetMove()) == root_move_filter.end()) {
              continue;
            }
            if (edge.GetP() <= 0.0f) continue;
          '''
          if old not in s:
              raise SystemExit('target block not found or already changed')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/search/classic/search.cc
          git diff --cached --check
          git commit -m "search: respect root move filter in adaptive prefetch"
          git push origin HEAD:experiment/adaptive-prefetch
